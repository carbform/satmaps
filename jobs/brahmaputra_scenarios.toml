# SAR against SAR on the Dibrugarh products: the relation between the inputs is read from the files and printed on each figure.
#   L vs S   one sensor, two bands            L vs S1  different sensors, different bands
# Run:  satviz run jobs/brahmaputra_scenarios.toml --out outputs/brahmaputra_scenarios/
extends = "brahmaputra_sar.toml"

[[figures]]
name = "pair"
template = "sar_vs_sar"        # every pair of the listed SAR inputs
inputs = ["L", "S", "S1"]
theme = "minimal"
text = { title = "Radar against radar" }

[[figures]]
name = "tiles"
template = "sar_vs_sar"
arrangement = "grid"           # all three on one page
inputs = ["L", "S", "S1"]
theme = "minimal"
text = { title = "Radar against radar" }
