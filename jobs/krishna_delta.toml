# Krishna delta coast, Andhra Pradesh, October 2026, from the two local ISRO products:
#   EOS-04 SAR (11 Oct) and ResourceSat-2 LISS-IV (5 Oct). Needs no network.
# Run:  satviz run jobs/krishna_delta.toml --out outputs/krishna/
# The products are looked up in ./data (unzip the NRSC downloads there).

[scene]
name = "Krishna"
region = "Krishna delta, Andhra Pradesh"
author = "Sarat (NRSC/ISRO)"
website = "www.carbform.github.io"

[area]
center = [16.1176, 81.0905]    # lat, lon
size_km = [20.0, 20.0]
resolution_m = 10

[[inputs]]
id = "E"
sensor = "eos04"
source = { path = "E04_SAR_MRS_11OCT2026_284002842630_25701_STUC00ZTD_2508_17_DH_D_R_N16169_E080824" }

[[inputs]]
id = "L4"
sensor = "liss4"
source = { path = "R2F05OCT2026080242010300062SSANSTUC00GTDA" }

# LISS-IV has no blue band, so the optical panel is NIR false colour (vegetation red, water dark).
[[figures]]
name = "krishna"
template = "compare"
inputs = ["E", "L4"]                  # left, right
recipes = { E = "sar_fcc", L4 = "nir_fcc" }
theme = ["minimal", "neo_brutal", "neo_retro"]
text = { title = "Radar and optical, one coast", subtitle = "EOS-04 AND LISS-IV" }
