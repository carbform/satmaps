# The five themes on one radar-and-optical figure (Sentinel-1 next to LISS-IV), used for the README previews.
# Run:  satviz run jobs/brahmaputra_themes.toml --out outputs/brahmaputra_themes/
extends = "brahmaputra_optical.toml"

[[figures]]
name = "themes"
template = "optical_sar"
inputs = ["S1", "L4"]
theme = ["neo_retro", "minimal", "neo_brutal", "newspaper", "xkcd"]
text = { title = "Radar and optical, one river" }
