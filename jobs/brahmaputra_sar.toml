# Brahmaputra near Dibrugarh from three local SAR products: NISAR L-band and S-band (25 Sep) and Sentinel-1 GRD (25 Sep).
# Needs no network. Run:  satviz run jobs/brahmaputra_sar.toml --out outputs/brahmaputra_sar/
# Unzip the Sentinel-1 download into ./data first (the .SAFE folder).

[scene]
name = "Brahmaputra"
region = "Dibrugarh, Assam"
author = "Sarat (NRSC/ISRO)"
website = "www.carbform.github.io"

[area]
center = [27.60279514, 94.87069168]   # lat, lon
size_km = [29.0, 30.8]
resolution_m = 10

[[inputs]]
id = "L"
sensor = "nisar_gcov"
source = { path = "NISAR_L2_PR_GCOV_031_112_A_016_4005_DHDH_A_20260925T225740_20260925T225815_P05023_N_F_J_001.h5" }

[[inputs]]
id = "S"
sensor = "nisar_gcov"
source = { path = "NISAR_S2_PR_GCOV_031_112_A_016_3700_DHNA_A_20260925T225740_20260925T225816_P00500_M_F_I_001.h5" }

[[inputs]]
id = "S1"
sensor = "sentinel1_grd"
source = { path = "S1D_IW_GRDH_1SDV_20260925T114837_20260925T114902_004734_008DBE_F331.SAFE" }

[[figures]]
name = "sar"
template = "compare"
inputs = ["L", "S", "S1"]
pairs = "all"
recipes = { default = "sar_fcc" }
theme = ["minimal", "neo_retro"]
text = { title = "Three radars, one river", subtitle = "NISAR AND SENTINEL-1" }

[[figures]]
name = "sar_grid"
template = "grid"
inputs = ["L", "S", "S1"]
recipes = { default = "sar_fcc" }
theme = "minimal"
text = { title = "Three radars, one river", subtitle = "NISAR L, NISAR S AND SENTINEL-1" }
