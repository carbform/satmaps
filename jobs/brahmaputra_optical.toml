# Optical and radar over the Brahmaputra at Dibrugarh, all local: Sentinel-2C L2A (29 Sep), LISS-IV on ResourceSat-2A (19 Oct),
# Sentinel-1 GRD (25 Sep) and EOS-04 MRS (10 Sep). The dates differ by up to 39 days and the optical products are at different
# reflectance levels (surface and top-of-atmosphere); each figure says both.
# Run:  satviz run jobs/brahmaputra_optical.toml --out outputs/brahmaputra_optical/

[scene]
name = "Brahmaputra"
region = "Dibrugarh, Assam"
author = "Sarat (NRSC/ISRO)"
website = "www.carbform.github.io"

[area]
center = [27.60279514, 94.87069168]   # lat, lon
size_km = [29.0, 30.8]
resolution_m = 10

[[inputs]]
id = "S1"
sensor = "sentinel1_grd"
source = { path = "S1D_IW_GRDH_1SDV_20260925T114837_20260925T114902_004734_008DBE_F331.SAFE" }

[[inputs]]
id = "E"
sensor = "eos04"
source = { path = "E04_SAR_MRS_10SEP2026_253234052550_25247_STUC00ZTD_1830_6_DH_D_R_N27673_E094265" }

[[inputs]]
id = "S2"
sensor = "sentinel2_safe"
source = { path = "S2C_MSIL2A_20260929T041551_N0513_R090_T46RFR_20260929T075413.SAFE" }

[[inputs]]
id = "L4"
sensor = "liss4"
source = { path = "RAF19OCT2026051193011300052SSANSTUC00GTDA" }

# optical against optical: LISS-IV has no blue band, so both sides get NIR false colour, like with like
[[figures]]
name = "optical"
template = "optical"
arrangement = "compare"
inputs = ["S2", "L4"]
theme = "minimal"
text = { title = "Two optical eyes" }

# every radar against every optical, radar on the left
[[figures]]
name = "radar_optical"
template = "optical_sar"
inputs = ["S1", "E", "S2", "L4"]
theme = "minimal"
text = { title = "Radar and optical" }

# all four on one page
[[figures]]
name = "tiles"
template = "optical_sar"
arrangement = "grid"
inputs = ["S1", "E", "S2", "L4"]
theme = ["minimal", "newspaper"]
text = { title = "Radar and optical, one river" }
