# Four radars over the Brahmaputra at Dibrugarh: NISAR L and S and Sentinel-1 GRD (25 Sep) and EOS-04 MRS (10 Sep).
# EOS-04 and Sentinel-1 are both C-band, so that pair is "same band, different sensors"; the figure states the 15 days between them.
# Run:  satviz run jobs/brahmaputra_all.toml --out outputs/brahmaputra_all/
extends = "brahmaputra_sar.toml"

[[inputs]]
id = "L"
sensor = "nisar_gcov"
source = { path = "NISAR_L2_PR_GCOV_031_112_A_016_4005_DHDH_A_20260925T225740_20260925T225815_P05023_N_F_J_001.h5" }

[[inputs]]
id = "S"
sensor = "nisar_gcov"
source = { path = "NISAR_S2_PR_GCOV_031_112_A_016_3700_DHNA_A_20260925T225740_20260925T225816_P00500_M_F_I_001.h5" }

[[inputs]]
id = "S1"
sensor = "sentinel1_grd"
source = { path = "S1D_IW_GRDH_1SDV_20260925T114837_20260925T114902_004734_008DBE_F331.SAFE" }

[[inputs]]
id = "E"
sensor = "eos04"
source = { path = "E04_SAR_MRS_10SEP2026_253234052550_25247_STUC00ZTD_1830_6_DH_D_R_N27673_E094265" }

[[figures]]
name = "pair"
template = "sar_vs_sar"
inputs = ["L", "S", "S1", "E"]          # every pair: six figures
theme = "minimal"
text = { title = "Radar against radar" }

[[figures]]
name = "tiles"
template = "sar_vs_sar"
arrangement = "grid"                    # all four on one page
inputs = ["L", "S", "S1", "E"]
theme = ["minimal", "newspaper"]
text = { title = "Four radars, one river" }
