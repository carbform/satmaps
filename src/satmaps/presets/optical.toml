# Optical from local files (Sentinel-2 L2A or LISS-IV): each product band by band, and/or compared side by side.
# Edit the area, the file names and the wording, then:  satmaps run optical.toml
# Unzip the downloads into ./data first (the Sentinel-2 .SAFE folder, the NRSC product folder).

[scene]
name = "My place"
region = "Somewhere, Somewhere"
author = ""
website = ""

[area]
center = [27.60, 94.87]       # lat, lon
size_km = [20, 20]
resolution_m = 10

[[inputs]]
id = "S2"
sensor = "sentinel2"          # sentinel2 or liss4
source = { path = "S2*_MSIL2A_*.SAFE" }

[[inputs]]
id = "L4"
sensor = "liss4"
source = { path = "RAF*" }

[[figures]]
name = "bands"
template = "optical"
arrangement = "bands"         # a panel per spectral band, one figure per input; composites = ["true_colour", "nir_fcc"] adds composites
inputs = ["S2", "L4"]
theme = "minimal"
text = { title = "Band by band" }

[[figures]]
name = "pair"
template = "optical"          # one input: one figure. Two or more: every pair, split view
inputs = ["S2", "L4"]
recipes = { default = "nir_fcc" }   # true_colour (needs a blue band), nir_fcc, swir_fcc, ndvi, ndwi
theme = "minimal"
text = { title = "My title", subtitle = "SENTINEL-2 AND LISS-IV" }
