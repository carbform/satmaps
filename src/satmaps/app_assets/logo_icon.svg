<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="earthGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <radialGradient id="spaceBackdrop" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="85%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Space Backdrop -->
  <circle cx="60" cy="60" r="54" fill="url(#spaceBackdrop)" stroke="url(#orbitGrad)" stroke-width="2" stroke-opacity="0.85"/>

  <!-- Distant Cosmic Stars -->
  <circle cx="32" cy="28" r="1.3" fill="#ffffff" opacity="0.9"/>
  <circle cx="48" cy="20" r="0.9" fill="#7dd3fc" opacity="0.7"/>
  <circle cx="92" cy="24" r="1.1" fill="#ffffff" opacity="0.8"/>
  <circle cx="26" cy="65" r="0.8" fill="#93c5fd" opacity="0.6"/>
  <polygon points="34,42 35.5,45 38.5,46 35.5,47 34,50 32.5,47 29.5,46 32.5,45" fill="#38bdf8" opacity="0.85"/>

  <!-- Earth Horizon Arc -->
  <path d="M 18 84 A 50 50 0 0 0 102 84 Z" fill="url(#earthGrad)" />
  <path d="M 18 84 A 50 50 0 0 0 102 84" stroke="#38bdf8" stroke-width="2.5" fill="none" filter="url(#glow)" opacity="0.9" />
  <path d="M 23 87 A 48 48 0 0 0 97 87" stroke="#7dd3fc" stroke-width="1" fill="none" opacity="0.6" />

  <!-- Coordinates / Graticules on Earth -->
  <path d="M 36 93 Q 60 84 84 93" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="2 2" fill="none" opacity="0.45"/>
  <path d="M 60 84 L 60 110" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.45"/>

  <!-- Radar Swath Footprint -->
  <polygon points="46,87 74,87 81,99 39,99" fill="#38bdf8" fill-opacity="0.25" stroke="#38bdf8" stroke-width="0.9" stroke-dasharray="2 1"/>

  <!-- Orbital Trajectory Ellipse -->
  <ellipse cx="60" cy="56" rx="43" ry="23" transform="rotate(-26 60 56)" stroke="#60a5fa" stroke-width="1.4" stroke-dasharray="4 3" fill="none" opacity="0.7" />

  <!-- Radar Wavefront Pulses -->
  <path d="M 64 54 Q 58 64 54 75" stroke="#38bdf8" stroke-width="1.6" fill="none" opacity="0.8" stroke-linecap="round"/>
  <path d="M 70 58 Q 63 70 57 82" stroke="#38bdf8" stroke-width="1.3" fill="none" opacity="0.55" stroke-linecap="round"/>
  <path d="M 76 62 Q 68 76 61 88" stroke="#38bdf8" stroke-width="0.9" fill="none" opacity="0.3" stroke-linecap="round"/>

  <!-- Satellite at Orbit Apex -->
  <g transform="translate(77, 36) rotate(-26)">
    <!-- Left Solar Wing -->
    <rect x="-24" y="-5" width="16" height="10" rx="1.5" fill="#0f172a" stroke="#38bdf8" stroke-width="0.8"/>
    <rect x="-23" y="-4" width="14" height="8" rx="1" fill="url(#panelGrad)" opacity="0.85"/>
    <line x1="-16" y1="-5" x2="-16" y2="5" stroke="#0f172a" stroke-width="0.6"/>
    <line x1="-24" y1="0" x2="-8" y2="0" stroke="#0f172a" stroke-width="0.6"/>

    <!-- Right Solar Wing -->
    <rect x="8" y="-5" width="16" height="10" rx="1.5" fill="#0f172a" stroke="#38bdf8" stroke-width="0.8"/>
    <rect x="9" y="-4" width="14" height="8" rx="1" fill="url(#panelGrad)" opacity="0.85"/>
    <line x1="16" y1="-5" x2="16" y2="5" stroke="#0f172a" stroke-width="0.6"/>
    <line x1="8" y1="0" x2="24" y2="0" stroke="#0f172a" stroke-width="0.6"/>

    <!-- Main Bus Chassis -->
    <rect x="-7" y="-7" width="14" height="14" rx="2" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="1"/>
    <circle cx="0" cy="0" r="2.2" fill="#0f172a"/>

    <!-- Radar Dish Antenna -->
    <path d="M -5 7 Q 0 12 5 7" stroke="#e2e8f0" stroke-width="1.5" fill="none"/>
    <line x1="0" y1="7" x2="0" y2="10" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="0" cy="10" r="1.3" fill="#38bdf8" filter="url(#glow)"/>
  </g>
</svg>