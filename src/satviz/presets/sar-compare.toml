# Two SAR products side by side, e.g. NISAR L-band vs S-band (any two inputs on the same area).
# Edit the area, the file names and the wording, then:  satviz run sar-compare.toml

[scene]
name = "My place"
region = "Somewhere, Somewhere"
author = ""
website = ""

[area]
center = [27.60, 94.87]
size_km = [20, 20]
resolution_m = 10

[[inputs]]
id = "L"
sensor = "nisar_gcov"
source = { path = "NISAR_L2_*_GCOV_*.h5" }

[[inputs]]
id = "S"
sensor = "nisar_gcov"
source = { path = "NISAR_S2_*_GCOV_*.h5" }

# Optional zoom windows (up to 3), by place: they appear as small pairs beside the main map
# [[zooms]]
# key = "A"
# name = "HILL EDGE"
# center = [27.65, 94.80]
# size_km = [7.8, 3.0]

[[figures]]
template = "sar_vs_sar"       # the figure says how the two relate: same band, different bands, or one sensor in two bands
inputs = ["L", "S"]           # with three or more, every pair gets its own figure; arrangement = "grid" puts them on one page
theme = ["neo_retro"]
stretch = "per-band"          # or "pooled" (same colours in both, comparable)
text = { title = "My title", subtitle = "L-BAND AND S-BAND, SAME PASS" }
