# Radar next to optical for the same place: a split map on one pixel grid, radar on the left, the days between them stated.
# Edit the area, the file names and the wording, then:  satviz run sar-optical.toml
# Unzip the downloads into ./data first.

[scene]
name = "My place"
region = "Somewhere, Somewhere"
author = ""
website = ""

[area]
center = [27.60, 94.87]       # lat, lon
size_km = [20, 20]
resolution_m = 10

[[inputs]]
id = "sar"
sensor = "nisar"              # nisar, sentinel1 or eos04
source = { path = "NISAR_L2_*_GCOV_*.h5" }

[[inputs]]
id = "opt"
sensor = "sentinel2"          # sentinel2 or liss4
source = { path = "S2*_MSIL2A_*.SAFE" }

[[figures]]
template = "sar_optical"      # every SAR input against every optical one; arrangement = "grid" tiles them all on one page
inputs = ["sar", "opt"]
theme = ["neo_retro", "minimal"]
text = { title = "Radar meets optical", subtitle = "NISAR AND SENTINEL-2" }
