# One SAR scene as a social graphic (NISAR L2 GCOV today; more SAR sensors as they are added).
# Edit the area, the file name and the wording, then:  satviz run sar.toml

[scene]                       # all optional
name = "My place"
region = "Somewhere, Somewhere"
author = ""
website = ""

[area]                        # give `center` + radius_km (or size_km = [w, h]), OR bbox = [west, south, east, north]
center = [27.60, 94.87]       # lat, lon
radius_km = 12
# resolution_m = 10           # default: the input's own resolution

[[inputs]]
id = "sar"
sensor = "nisar_gcov"
source = { path = "NISAR_*_GCOV_*.h5" }   # a file or a glob, looked up in ./data (or --data-dir)

[[figures]]
template = "single"
inputs = ["sar"]
theme = "neo_retro"           # neo_retro, minimal, neo_brutal; a list gives one file per theme
text = { title = "My title", subtitle = "SEEN BY NISAR" }
