<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>satviz area map</title>
<!--
  A Streamlit custom component with no build step and no network: it draws where the chosen products have data and lets you drag
  a rectangle for the area. Streamlit's component protocol is three messages: tell the page we are ready, receive "render" with
  the arguments, and send back a value. Arguments: footprints [{name, kind, ring: [[lon, lat], ...]}], overlap [w, s, e, n] or null
  (what the app would use on its own), box [w, s, e, n] or null (the rectangle now chosen). Value sent back on every change:
  {box: [w, s, e, n] or null, n: counter}.
-->
<style>
  :root { --ink: #1c1c1e; --muted: #6b6f76; --line: #d9dbe0; --bg: #fbfbfc; --sar: #2a8f8a; --optical: #d9822b; --box: #e0245e; }
  @media (prefers-color-scheme: dark) { :root { --ink: #ececf0; --muted: #9aa0a8; --line: #3a3d44; --bg: #16171a; } }
  html, body { margin: 0; font: 13px system-ui, sans-serif; color: var(--ink); background: transparent; }
  #wrap { position: relative; }
  canvas { display: block; width: 100%; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); cursor: crosshair; touch-action: none; }
  #bar { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 6px 2px 0; color: var(--muted); }
  #readout { font-variant-numeric: tabular-nums; }
  button { font: inherit; padding: 3px 10px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; }
  button:hover { border-color: var(--box); color: var(--box); }
  #legend span { margin-right: 12px; } #legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="map" height="420"></canvas>
  <div id="bar"><div id="legend"></div><div><span id="readout">drag on the map to draw the area</span> <button id="clear">Clear</button></div></div>
</div>
<script>
"use strict";
const cv = document.getElementById("map"), ctx = cv.getContext("2d");
const readout = document.getElementById("readout");
let args = {footprints: [], overlap: null, box: null}, box = null, drag = null, hover = null, counter = 0, view = null;

const send = (type, data) => window.parent.postMessage(Object.assign({isStreamlitMessage: true, type}, data), "*");
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function bounds() {
  let w = 1e9, s = 1e9, e = -1e9, n = -1e9;
  const take = (lon, lat) => { w = Math.min(w, lon); e = Math.max(e, lon); s = Math.min(s, lat); n = Math.max(n, lat); };
  args.footprints.forEach(f => f.ring.forEach(p => take(p[0], p[1])));
  if (args.box) { take(args.box[0], args.box[1]); take(args.box[2], args.box[3]); }
  if (w > e) { w = -180; e = 180; s = -80; n = 80; }
  const px = Math.max((e - w) * 0.08, 0.05), py = Math.max((n - s) * 0.08, 0.05);
  return [w - px, s - py, e + px, n + py];
}

// equirectangular, scaled by cos(latitude) so a degree of longitude is as long as it is on the ground
function makeView(b) {
  const W = cv.clientWidth || 640, H = 420, k = Math.cos((b[1] + b[3]) / 2 * Math.PI / 180);
  const sx = W / ((b[2] - b[0]) * k), sy = H / (b[3] - b[1]), sc = Math.min(sx, sy);
  const ox = (W - (b[2] - b[0]) * k * sc) / 2, oy = (H - (b[3] - b[1]) * sc) / 2;
  return {W, H, k, sc, ox, oy, b,
    x: lon => ox + (lon - b[0]) * k * sc, y: lat => oy + (b[3] - lat) * sc,
    lon: px => b[0] + (px - ox) / (k * sc), lat: py => b[3] - (py - oy) / sc};
}

function step(span) { const raw = span / 5, p = Math.pow(10, Math.floor(Math.log10(raw))); return [1, 2, 5, 10].map(m => m * p).find(v => v >= raw); }

function draw() {
  const dpr = window.devicePixelRatio || 1;
  cv.width = (cv.clientWidth || 640) * dpr; cv.height = 420 * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  view = makeView(bounds());
  ctx.clearRect(0, 0, view.W, view.H);
  ctx.font = "11px system-ui, sans-serif"; ctx.lineWidth = 1;
  const g = step(Math.max(view.b[2] - view.b[0], view.b[3] - view.b[1]));
  ctx.strokeStyle = css("--line"); ctx.fillStyle = css("--muted");
  for (let lon = Math.ceil(view.b[0] / g) * g; lon <= view.b[2]; lon += g) { ctx.beginPath(); ctx.moveTo(view.x(lon), 0); ctx.lineTo(view.x(lon), view.H); ctx.stroke(); ctx.fillText(lon.toFixed(g < 1 ? 1 : 0) + "°E", view.x(lon) + 3, view.H - 4); }
  for (let lat = Math.ceil(view.b[1] / g) * g; lat <= view.b[3]; lat += g) { ctx.beginPath(); ctx.moveTo(0, view.y(lat)); ctx.lineTo(view.W, view.y(lat)); ctx.stroke(); ctx.fillText(lat.toFixed(g < 1 ? 1 : 0) + "°N", 4, view.y(lat) - 3); }
  args.footprints.forEach(f => {
    const col = css(f.kind === "optical" ? "--optical" : "--sar");
    ctx.beginPath(); f.ring.forEach((p, i) => i ? ctx.lineTo(view.x(p[0]), view.y(p[1])) : ctx.moveTo(view.x(p[0]), view.y(p[1]))); ctx.closePath();
    ctx.globalAlpha = 0.14; ctx.fillStyle = col; ctx.fill(); ctx.globalAlpha = 1; ctx.strokeStyle = col; ctx.lineWidth = 1.5; ctx.stroke();
    const c = f.ring.reduce((a, p) => [a[0] + p[0] / f.ring.length, a[1] + p[1] / f.ring.length], [0, 0]);
    ctx.fillStyle = col; ctx.fillText(f.name, Math.max(4, view.x(c[0]) - ctx.measureText(f.name).width / 2), view.y(c[1]));
  });
  if (args.overlap) {   // what the app would draw with no box: dashed
    ctx.setLineDash([5, 4]); ctx.strokeStyle = css("--ink"); ctx.lineWidth = 1.2;
    rect(args.overlap); ctx.stroke(); ctx.setLineDash([]);
  }
  const shown = drag ? ordered(drag) : box;
  if (shown) { ctx.strokeStyle = css("--box"); ctx.lineWidth = 2; rect(shown); ctx.globalAlpha = 0.12; ctx.fillStyle = css("--box"); ctx.fill(); ctx.globalAlpha = 1; ctx.stroke(); }
  readout.textContent = shown ? "W " + shown[0].toFixed(3) + "  S " + shown[1].toFixed(3) + "  E " + shown[2].toFixed(3) + "  N " + shown[3].toFixed(3)
    : hover ? hover[0].toFixed(3) + "°E  " + hover[1].toFixed(3) + "°N" : "drag on the map to draw the area";
  const kinds = [...new Set(args.footprints.map(f => f.kind))];
  document.getElementById("legend").innerHTML = kinds.map(k => '<span><i style="background:' + css(k === "optical" ? "--optical" : "--sar") + '"></i>' + (k === "optical" ? "optical" : "radar") + '</span>').join("")
    + (args.overlap ? '<span><i style="border:1px dashed ' + css("--ink") + '"></i>overlap (the default)</span>' : "");
  send("streamlit:setFrameHeight", {height: document.documentElement.scrollHeight});
}
function rect(b) { ctx.beginPath(); ctx.rect(view.x(b[0]), view.y(b[3]), view.x(b[2]) - view.x(b[0]), view.y(b[1]) - view.y(b[3])); }
const ordered = d => [Math.min(d[0], d[2]), Math.min(d[1], d[3]), Math.max(d[0], d[2]), Math.max(d[1], d[3])];
const at = ev => { const r = cv.getBoundingClientRect(); const px = (ev.clientX - r.left) * (view.W / r.width), py = (ev.clientY - r.top) * (view.H / r.height); return [view.lon(px), view.lat(py)]; };

cv.addEventListener("pointerdown", ev => { cv.setPointerCapture(ev.pointerId); const p = at(ev); drag = [p[0], p[1], p[0], p[1]]; });
cv.addEventListener("pointermove", ev => { hover = at(ev); if (drag) { const p = at(ev); drag[2] = p[0]; drag[3] = p[1]; } draw(); });
cv.addEventListener("pointerup", ev => {
  if (!drag) return;
  const b = ordered(drag); drag = null;
  const tiny = (b[2] - b[0]) * view.k * view.sc < 6 || (b[3] - b[1]) * view.sc < 6;   // a click, not a rectangle
  if (!tiny) { box = b; counter += 1; send("streamlit:setComponentValue", {value: {box: b, n: counter}, dataType: "json"}); }
  draw();
});
cv.addEventListener("pointerleave", () => { hover = null; if (!drag) draw(); });
document.getElementById("clear").addEventListener("click", () => { box = null; counter += 1; send("streamlit:setComponentValue", {value: {box: null, n: counter}, dataType: "json"}); draw(); });
window.addEventListener("resize", draw);

window.addEventListener("message", ev => {
  if (!ev.data || ev.data.type !== "streamlit:render") return;
  args = Object.assign({footprints: [], overlap: null, box: null}, ev.data.args);
  if (!drag) box = args.box;
  draw();
});
send("streamlit:componentReady", {apiVersion: 1});
draw();
</script>
</body>
</html>
