# Wording for the clean white L-vs-S figure (`nisar-viz render ls-clean`). See ls_social.toml for the placeholder rules.

[header]
title = "NISAR L-band and S-band SAR over the {name}"
subtitle = "False colour composite  ·  dual-pol {polarisations}  ·  same {pass_direction} pass  ·  near {region}"
date = "{date}  ·  {time_utc} UTC"
meta = "Track {track}  ·  Frame {frame}  ·  {posting_m} m"

[panels]
L_label = "L-BAND"
L_sub = "{L.freq_ghz:g} GHz · ≈{L.wavelength_cm:.0f} cm"
S_label = "S-BAND"
S_sub = "{S.freq_ghz:g} GHz · ≈{S.wavelength_cm:.0f} cm"

[footer]
channels_title = "RGB CHANNEL ASSIGNMENT  ·  SAME STRETCH IN BOTH BANDS"
quality_title = "ACQUISITION AND DATA QUALITY"
channel_labels = ["R  HH γ⁰", "G  HV γ⁰", "B  HH−HV"]   # the dB range of each channel is added automatically
legend_line = "Purple: HH high, HV low  ·  Lime: HV high  ·  Dark grey: HV below noise floor (SNR < 3 dB)"
quality_line = "HV pixels below noise floor:  L-band {L.noisy_hv_pct:.0f}%   ·   S-band {S.noisy_hv_pct:.0f}%"
note = [   # at most 1 line
  { if = "uncal_bands", text = "{uncal_bands} calibration metadata not yet populated: {uncal_bands} dB values are provisional." },
]
credit = "Data: NASA–ISRO NISAR, L2 GCOV  ·  Visualisation: {author}  ·  {website}"
