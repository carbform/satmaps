# Caption and credit for the S-band-only publication figure (`nisar-viz render sband-publication`).
# Sentences are joined with a space. Extra placeholders here: {k}, {block_m}.

[figure]
caption = [
  "Figure. {reach} {callout_caption}, NISAR S-SAR L2 GCOV, {date} {time_utc} UTC, {pass_direction}, {S.bandwidth_mhz:g} MHz {polarisations} mode, {posting_m} m posting, {S.looks:.0f} looks; panels are {k}×{k} block means ({block_m} m) of linear power.",
  "Radiometric-terrain-corrected γ⁰ is shown; σ⁰ = η·γ⁰ with η = {S.eta_p1:.2f}–{S.eta_p99:.2f} (1st–99th percentile) here.",
  "The product's noise-equivalent backscatter (HV median {S.nebs_hv_db_median:.1f} dB, consistent with the < −20 dB design goal; documented as σ⁰-referenced, so divided by η to give a γ⁰ floor) was subtracted where SNR ≥ 3 dB; {S.noisy_hv_pct:.0f}% of {posting_m} m HV pixels fall below that threshold ({S.noisy_hv_pct_gamma:.0f}% if the layer were γ⁰-referenced), mostly open water, and are not interpreted.",
  "The processor applied no ionospheric or wet-tropospheric geolocation correction (S-band is ~5× less ionosphere-sensitive than L-band) and no shadow/layover mask (terrain is flat here).",
  { if = "uncal_bands", text = "Calibration scale factors in the product metadata are unpopulated, so absolute levels are provisional." },
  "Colour limits: 2nd–98.5th percentiles.",
]
credit = "Data: NASA-ISRO NISAR, L2 GCOV (S-SAR), product spec {S.spec_version}, CRID {S.crid}. Processing: {author}."
