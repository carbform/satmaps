[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "satviz"
version = "0.1.0"
description = "Social, publication and editorial infographics from satellite data: NISAR first, optical next"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Sarat" }]
dependencies = [
    "h5py>=3.8",
    "numpy>=1.24",
    "scipy>=1.10",
    "pyproj>=3.5",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "pillow>=10"]

[project.scripts]
satviz = "satviz.cli:main"
nisar-viz = "satviz.cli:main"  # alias kept from the NISAR-only days

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
satviz = ["layouts/*.toml", "presets/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
src = ["src", "tests"]
extend-exclude = ["archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
# Figure modules carry long caption strings and layout coordinates; tests build wide fixtures.
"src/satviz/figures/*.py" = ["E501"]
"src/satviz/themes/*.py" = ["E501"]
"src/satviz/templates/*.py" = ["E501"]
"tests/*.py" = ["E501"]
