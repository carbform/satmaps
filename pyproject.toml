[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "satmaps"
version = "0.1.0"
description = "Social, publication and editorial infographics from SAR (NISAR, Sentinel-1, EOS-04) and optical (Sentinel-2, LISS-IV) satellite data"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Sarat" }]
dependencies = [
    "h5py>=3.8",
    "numpy>=1.24",
    "scipy>=1.10",
    "pyproj>=3.5",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
rasters = ["rasterio>=1.3"]  # every product but NISAR is GeoTIFF: Sentinel-1, EOS-04, Sentinel-2, LISS-IV
app = ["streamlit>=1.32"]  # `satmaps app`: the local app
dev = ["pytest>=7", "ruff>=0.4", "pillow>=10"]

[project.scripts]
satmaps = "satmaps.cli:main"
satviz = "satmaps.cli:main"  # the old command name, kept for now

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
satmaps = ["layouts/*.toml", "presets/*.toml", "app_component/*.html", "app_assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
# Figure modules carry long caption strings and layout coordinates; tests build wide fixtures.
"src/satmaps/themes/*.py" = ["E501"]
"src/satmaps/arrangements/*.py" = ["E501"]
"src/satmaps/templates/*.py" = ["E501"]
"tests/*.py" = ["E501"]
