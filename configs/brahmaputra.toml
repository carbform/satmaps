# Brahmaputra scene: NISAR L-SAR and S-SAR GCOV from the same pass.
# Date, time, track, frame, pass direction, frequency, posting, CRS and processing flags are read from the
# files; figure wording (titles, notes, credits) is in layouts/*.toml.
# `inputs` are listed in priority order: the first is the reference for shared facts (track, frame, CRS, posting).
# Rows/cols are the ROI in each file's own 10 m UTM 46N grid. The L-band grid is offset by
# (+360 rows, +72 cols) from the S-band grid, so both ROIs cover the identical ground footprint
# (checked: 0 m offset in x and y).

[scene]
name = "Brahmaputra"
reach = "Braided Brahmaputra reach"
locality = "Dibrugarh"
region = "Dibrugarh, Assam"
callout_caption = "with the Simen confluence and sand bars (crosses)"
author = "Sarat (NRSC/ISRO)"
website = "www.carbform.github.io"

[[inputs]]
id = "S"
sensor = "nisar_gcov"
file = "NISAR_S2_PR_GCOV_031_112_A_016_3700_DHNA_A_20260925T225740_20260925T225816_P00500_M_F_I_001.h5"
group = "science/SSAR/GCOV"
rows = [27800, 30880]
cols = [11500, 14400]

[[inputs]]
id = "L"
sensor = "nisar_gcov"
file = "NISAR_L2_PR_GCOV_031_112_A_016_4005_DHDH_A_20260925T225740_20260925T225815_P05023_N_F_J_001.h5"
group = "science/LSAR/GCOV"
rows = [28160, 31240]
cols = [11572, 14472]

# Zoom windows in ROI pixels (10 m): 300 x 780 px = 3.0 x 7.8 km each
[[zooms]]
key = "A"
name = "HILL EDGE"
rows = [520, 820]
cols = [560, 1340]

[[zooms]]
key = "B"
name = "SAND BARS"
rows = [2500, 2800]
cols = [1200, 1980]

[[zooms]]
key = "C"
name = "SOUTH BANK"
rows = [2600, 2900]
cols = [2000, 2780]

# Points of interest (WGS84); positions come from earlier work and were not re-verified against a map.
[callouts.simen]
lat = 27.591
lon = 94.8725

[callouts.bars]
lat = 27.565
lon = 94.905
